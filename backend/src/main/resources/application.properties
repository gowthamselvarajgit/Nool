spring.application.name=backend

# ── Load .env from backend working dir if present (optional) ──────────────────
# Lets us keep secrets out of source control. Production deployments can skip
# the .env file entirely and set OS-level environment variables instead.
spring.config.import=optional:file:./.env[.properties]

# ── Server ────────────────────────────────────────────────────────────────────
server.port=${SERVER_PORT:8083}
server.servlet.context-path=/api

# ── JWT ───────────────────────────────────────────────────────────────────────
# jwt.secret MUST be set via env (or .env) in any non-throwaway environment.
# A weak fallback is provided so local dev still boots, but production builds
# must override.
jwt.secret=${JWT_SECRET:CHANGE_ME_IN_PRODUCTION_THIS_IS_A_DEV_ONLY_FALLBACK_KEY_AT_LEAST_64_CHARS}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ── Super-admin seed (env-driven) ─────────────────────────────────────────────
# Set SUPER_ADMIN_MOBILE and SUPER_ADMIN_PASSWORD in .env. On first startup,
# AdminBootstrapRunner creates one SUPER_ADMIN account using these values.
# The super admin then creates ADMIN accounts in-app.
super-admin.mobile=${SUPER_ADMIN_MOBILE:}
super-admin.password=${SUPER_ADMIN_PASSWORD:}
super-admin.name=${SUPER_ADMIN_NAME:Super Admin}

# ── Workshop configuration ────────────────────────────────────────────────────
# Fallback owner polish rate used only when an owner has no per-owner rate set.
nool.rate-per-saree=${NOOL_RATE_PER_SAREE:70.0}

# ── Database ──────────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nool_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA ───────────────────────────────────────────────────────────────────────
# Set JPA_DDL_AUTO=validate (or none) in production after the first deploy
# and manage schema changes through proper migrations.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jackson.time-zone=Asia/Kolkata

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:warn}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${SQL_BIND_LOG_LEVEL:warn}

# ── CORS ──────────────────────────────────────────────────────────────────────
# Comma-separated list of allowed origins. Override in production to lock down
# to your deployed frontend URL(s).
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:4173,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:4173,https://nool-rouge.vercel.app,https://noolerp.vercel.app}

# ── Misc ──────────────────────────────────────────────────────────────────────
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
