# Render service blueprint for the NOOL backend.
# https://render.com/docs/blueprint-spec
#
# How to use:
#   1. Push this file to the repo.
#   2. In Render dashboard → New → Blueprint → connect this repo.
#   3. Render reads this file and provisions the service automatically.
#
# Frontend is hosted separately on Cloudflare Pages (or any static host) — it
# is not part of this blueprint.

services:
  - type: web
    name: nool-backend
    runtime: docker
    plan: free
    region: singapore           # closest to India on Render's free tier
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/auth/validate
    autoDeploy: true            # redeploy on every push to main

    # All secrets must be set in the Render dashboard (sync: false → not
    # committed to the repo). Defaults shown here are safe public values.
    envVars:
      # ── REQUIRED secrets (set values in the dashboard) ────────────────────
      - key: JWT_SECRET
        sync: false
      - key: SUPER_ADMIN_NAME
        sync: false
      - key: SUPER_ADMIN_MOBILE
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false

      # ── Safe-to-commit defaults ───────────────────────────────────────────
      - key: JWT_EXPIRATION
        value: "86400000"
      - key: JPA_DDL_AUTO
        value: update            # change to "validate" after first successful boot
      - key: JPA_SHOW_SQL
        value: "false"
      - key: NOOL_RATE_PER_SAREE
        value: "70.0"
      - key: SQL_LOG_LEVEL
        value: warn
      - key: SQL_BIND_LOG_LEVEL
        value: warn
